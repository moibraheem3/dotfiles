source = $HOME/.cache/wal/colors-hyprland.conf

background {
    monitor =
    color = $color0
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 600, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $color0
    outer_color = $color4
    outline_thickness = 2

    font_family = CaskaydiaMono Nerd Font
    font_color = $foreground

    placeholder_text =   Enter Password 󰈷 
    check_color = $color2
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

    rounding = 14
    shadow_passes = 1
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
